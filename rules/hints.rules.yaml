# intent hints: suspicious identifiers add a little evidence; they never block on their own (weight < 0.5)

- id: hint.data_exfiltration
  category: data_exfiltration
  weight: 0.30
  when:
    cap: NAME_HINT
    extra_eq: {hint_cat: data_exfiltration}
  does: "is named like something that does this ({target})"
  why: "function names often reveal what the author intends"
  would: "the code is likely to behave as its name says"


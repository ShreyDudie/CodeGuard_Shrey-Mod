# secret_access - reading credentials, API keys or tokens (or embedding them)
- id: secret.credential_file_read
  category: secret_access
  weight: 0.80
  tags: [T1552.001]
  when:
    cap: READ_FILE
    pathc_any: [SECRET_STORE]
  unless:
    any:
      - {target_re: '(^|/)\.env([.\-][\w.\-]+)?$'}
      - {flags_any: [archive_src, upload_read]}
  does: "reads {target}, a file that stores {pathdesc}"
  why: "those files hold passwords, keys or tokens that unlock accounts and servers"
  would: "the secrets would be loaded into the program, ready to be used or sent somewhere else"

- id: secret.env_file_read
  category: secret_access
  weight: 0.50
  tags: [T1552.001]
  when:
    cap: READ_FILE
    target_re: '(^|/)\.env([.\-][\w.\-]+)?$'
  does: "reads the environment file {target}"
  why: "environment files usually contain passwords and API keys"
  would: "those secrets would be loaded into the program"

- id: secret.credential_file_archived
  category: secret_access
  weight: 0.80
  tags: [T1552.001, T1560]
  when:
    cap: READ_FILE
    pathc_any: [SECRET_STORE]
    flags_any: [archive_src, upload_read]
  does: "packs up {target}, a file that stores {pathdesc}"
  why: "bundling credential files is the usual first step before stealing them"
  would: "the credentials would be copied into an archive or upload"

- id: secret.hardcoded
  category: secret_access
  weight: conf
  tags: [T1552.001]
  when:
    cap: SECRET_LITERAL
  does: "has a real-looking secret ({target}) written directly in the source code"
  why: "anyone who can read the code (or its history) can use that credential"
  would: "the credential would be exposed to every reader of the file and stay valid until revoked"

- id: secret.env_secret_name
  category: secret_access
  weight: 0.72
  tags: [T1552]
  when:
    cap: ENV_READ
    flags_any: [secret_name]
  unless:
    flags_any: [used_as_credential]
  does: "reads the secret environment variable {target}"
  why: "environment secrets should stay inside the program"
  would: "the secret value would be read into memory"

- id: secret.proc_environ
  category: secret_access
  weight: 0.85
  tags: [T1552.007]
  when:
    cap: READ_FILE
    target_re: '^/proc/(self|\d+)/environ$'
  does: "reads the environment of a running process through {target}"
  why: "process environments often contain passwords and tokens"
  would: "those secrets would be collected"

- id: secret.secret_shown_or_logged
  category: secret_access
  weight: 0.62
  tags: [T1552, CWE-532]
  when:
    cap: OUTPUT
    any:
      - {pl_all: [SECRET, ENV]}
      - {pl_any: [ENV_DUMP, SENS_SYS]}
  does: "reads {src} and prints or logs its value"
  why: "secrets that reach the screen or a log file are copied into terminals, CI logs and monitoring tools"
  would: "the secret value would be visible to anyone who can read that output"

- id: secret.secret_copied_to_file
  category: secret_access
  weight: 0.66
  tags: [T1552, T1074]
  when:
    cap: WRITE_FILE
    pl_any: [SECRET]
    pl_none: [ENV, NET]
    pathc_none: [SECRET_STORE]
  does: "copies {src} into {target}"
  why: "a second, unprotected copy of a credential is easy to find and read"
  would: "the secret would sit in plain text in {target}"

- id: secret.env_dump_sent
  category: secret_access
  weight: 0.72
  tags: [T1552, T1048]
  when:
    cap: [NET_SEND, NET_FETCH, ICMP, DNS]
    pl_any: [ENV_DUMP]
    hostc_any: [LOOPBACK, PRIVATE, INTERNAL, META, LINKLOCAL]          # to an outside host the organiser's own examples count this as exfiltration only
  does: "collects every environment variable ({src}) and sends it out"
  why: "the environment is where passwords, tokens and keys are usually kept, and dumping all of it takes them all at once"
  would: "all secrets held in the environment would be handed to {host}"
